services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eu_leak
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: eu_leak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eu_leak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
