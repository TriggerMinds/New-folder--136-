    can_create_reference_observation: false
    base_url: https://cryptome.org
    poll_url: https://cryptome.org/
    languages:
      - en
    connector_config:
      item_selector: body a[href]
      max_items: 200
    enabled: true
    poll_interval_minutes: 60

  - id: nl_github_public_search
    name: GitHub EU Leak Repositories
    type: html
    source_layer: primary_raw
    source_category: git_host
    discovery_priority: primary
    can_create_primary_claim: true
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://github.com
    poll_url: https://github.com/search?o=desc&q=european+OR+netherlands+OR+commission+OR+eu+AND+leak+OR+classified+OR+confidential+OR+classified+documents&s=updated&type=repositories
    languages:
      - en
    connector_config:
      item_selector: div.d-flex h3 a
      max_items: 100
    enabled: true
    poll_interval_minutes: 30

