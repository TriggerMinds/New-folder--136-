  - id: nl_ddosecrets_mirror
    name: Distributed Denial of Secrets
    type: html
    source_role: mirror
    source_category: leak_archive
    discovery_priority: primary
    can_create_primary_claim: true
    base_url: https://ddosecrets.com
    poll_url: https://ddosecrets.com/wiki/Special:AllPages
    languages:
      - en
    content_modes:
      - links
      - documents
    access_method: html
    connector_config:
      item_selector: ul.mw-allpages-chunk a
      max_items: 100
    validation_notes: "Distributed Denial of Secrets - public leak archive mirror. All pages index contains document links. Last validated: 2026-07-28"
    validated_at: "2026-07-28"
    expected_content_types:
      - documents
      - archives
    enabled: true
    poll_interval_minutes: 60

