country_code: NL
status: active
sources:
  - id: nl_cryptome_archive
    name: Cryptome Document Archive
    type: raw_archive
    source_layer: primary_raw
    source_category: raw_leak_archive
    discovery_priority: primary
    can_create_primary_claim: false
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://cryptome.org
    poll_url: https://cryptome.org/
    languages:
      - en
    connector_config:
      archive_mode: cryptome
      max_items: 500
      max_index_depth: 2
      max_index_pages: 25
    enabled: true
    poll_interval_minutes: 60

  - id: nl_github_api
    name: GitHub API - EU Leak Repositories
    type: github_api
    source_layer: primary_raw
    source_category: git_host
    discovery_priority: primary
    can_create_primary_claim: false
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://github.com
    poll_url: https://api.github.com/search/repositories
    languages:
      - en
    connector_config:
      max_items: 200
      search_queries:
        - Netherlands+leak+OR+classified+OR+documents+OR+database+OR+dataset+OR+confidential
        - Netherlands+AND+(dump+OR+breach+OR+emails+OR+mailbox+OR+export)
        - EU+AND+(leak+OR+classified+OR+documents+OR+dataset+OR+confidential+OR+dump+OR+emails)
        - European+Commission+AND+(leak+OR+classified+OR+documents+OR+dump+OR+dataset)
        - Dutch+government+AND+(leak+OR+classified+OR+documents+OR+dump+OR+dataset)
        - Dutch+AND+(data+breach+OR+database+dump+OR+security+incident)
    enabled: true
    poll_interval_minutes: 30

  - id: nl_internet_archive_api
    name: Internet Archive - EU Document Collections
    type: internet_archive_api
    source_layer: primary_raw
    source_category: user_upload_archive
    discovery_priority: primary
    can_create_primary_claim: false
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://archive.org
    poll_url: https://archive.org/advancedsearch.php
    languages:
      - en
    connector_config:
      max_items: 200
      search_queries:
        - subject:(Netherlands) AND (leak OR breach OR dump OR classified OR confidential OR documents OR emails)
        - subject:(European Commission) AND (leak OR breach OR dump OR classified OR documents)
        - subject:(EU) AND (leak OR breach OR dump OR classified OR documents OR data)
    enabled: true
    poll_interval_minutes: 60
