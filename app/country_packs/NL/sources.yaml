country_code: NL
status: active
sources:
  - id: nl_ddosecrets_raw
    name: Distributed Denial of Secrets
    type: html
    source_layer: primary_raw
    source_category: raw_leak_archive
    discovery_priority: primary
    can_create_primary_claim: true
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://ddosecrets.com
    poll_url: https://ddosecrets.com/wiki/Special:AllPages
    languages:
      - en
    connector_config:
      item_selector: ul.mw-allpages-chunk a
      max_items: 100
    enabled: true
    poll_interval_minutes: 60

  - id: nl_cryptome_archive
    name: Cryptome Document Archive
