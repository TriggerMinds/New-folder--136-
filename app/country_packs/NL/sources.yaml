country_code: NL
status: active
sources:
  - id: nl_cryptome_archive
    name: Cryptome Document Archive
    type: raw_archive
    source_layer: primary_raw
    source_category: raw_leak_archive
    discovery_priority: primary
    can_create_primary_claim: true
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://cryptome.org
    poll_url: https://cryptome.org/
    languages:
      - en
    connector_config:
      archive_mode: cryptome
      max_items: 500
    enabled: true
    poll_interval_minutes: 60

  - id: nl_github_public_search
    name: GitHub EU Leak Repositories
    type: html
    source_layer: primary_raw
    source_category: git_host
    discovery_priority: primary
    can_create_primary_claim: true
    can_create_artifact_discovery: true
    can_create_reference_observation: false
    base_url: https://github.com
    poll_url: https://github.com/search
    languages:
      - en
    connector_config:
      max_items: 100
    enabled: false
    disabled_reason: HTML search connector is not operational and produced no validated artifacts
    poll_interval_minutes: 30

  - id: nl_archive_org_eu_data
